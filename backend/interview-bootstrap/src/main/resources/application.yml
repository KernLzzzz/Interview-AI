spring:
  application:
    name: interview-ai
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 160MB

interview:
  cache:
    question:
      key-prefix: interview:question-bank:scenario
      ttl: PT30M
      refresh-interval: PT20M
      warmup-enabled: true
      warmup-limit: 20
  evaluation:
    max-retries: 3
    retry-delay: PT1M
    callback-token: ${AI_CALLBACK_TOKEN:local-development-token}
    ai:
      enabled: ${AI_EVALUATION_ENABLED:false}
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      endpoint: ${AI_ENDPOINT:/chat/completions}
      model: ${AI_MODEL:}
      api-key: ${AI_API_KEY:}
      connect-timeout-seconds: 10
      read-timeout-seconds: 90


app:
  name: 多模态智能模拟面试评测平台
  version: 1.0.0
  description: 基于AI的面试模拟与评测系统
  author: Interview AI Team
  file:
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - image/jpeg
      - image/png
      - video/mp4
      - video/webm
      - audio/webm
      - audio/ogg
      - audio/mpeg
      - audio/mp4
    max-size: 157286400
