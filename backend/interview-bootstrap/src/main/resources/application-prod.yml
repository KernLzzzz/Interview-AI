server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:interview_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:interview}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:interviewai}

interview:
  evaluation:
    callback-token: ${AI_CALLBACK_TOKEN}
    ai:
      enabled: ${AI_EVALUATION_ENABLED:false}
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      endpoint: ${AI_ENDPOINT:/chat/completions}
      model: ${AI_MODEL:}
      api-key: ${AI_API_KEY:}

logging:
  level:
    com.iflytek: WARN
    org.springframework: ERROR
